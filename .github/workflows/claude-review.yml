name: Claude Code PR Review

on:
  workflow_run:
    workflows: ["Test Plugin"]
    types: [completed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # CI 全パス後の自動レビュー（同一リポジトリのPRのみ）
  setup:
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Get PR number
        id: pr
        run: |
          PR_NUMBER=$(gh pr list --head "${{ github.event.workflow_run.head_branch }}" --json number --jq '.[0].number')
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

  auto-review:
    needs: setup
    if: needs.setup.outputs.pr_number != ''
    uses: tarosky/workflows/.github/workflows/claude-review.yml@main
    with:
      plugin_name: never-let-me-go
      ci_checks: "PHPStan Level 5, PHPCS, PHP Lint, PHPUnit, asset build"
      pr_number: ${{ fromJSON(needs.setup.outputs.pr_number) }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      custom_focus: |
        - ユーザー削除・データ破棄（destroy_level / assign_to による投稿の再割当て・ユーザーメタ削除）が意図せず他ユーザーのデータを消さないか、権限・nonce チェックを含めて確認
        - 退会ページ・退会ボタンブロック（Page / ResignButton）とWooCommerce連携でのリダイレクト・ログアウト処理の安全性
        - WP-CLI コマンド（nlmg）や TranshBin の一括処理が後方互換を壊していないか
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # "@claude auto-review" で手動レビュー（メンバーのみ、PRコメントのみ）
  manual-setup:
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@claude auto-review') &&
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Get PR info
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=${{ github.event.issue.number }}
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT

  manual-review:
    needs: manual-setup
    if: needs.manual-setup.outputs.pr_number != ''
    uses: tarosky/workflows/.github/workflows/claude-review.yml@main
    with:
      plugin_name: never-let-me-go
      ci_checks: "PHPStan Level 5, PHPCS, PHP Lint, PHPUnit, asset build"
      pr_number: ${{ fromJSON(needs.manual-setup.outputs.pr_number) }}
      head_sha: ${{ needs.manual-setup.outputs.head_sha }}
      is_manual: true
      custom_focus: |
        - ユーザー削除・データ破棄（destroy_level / assign_to による投稿の再割当て・ユーザーメタ削除）が意図せず他ユーザーのデータを消さないか、権限・nonce チェックを含めて確認
        - 退会ページ・退会ボタンブロック（Page / ResignButton）とWooCommerce連携でのリダイレクト・ログアウト処理の安全性
        - WP-CLI コマンド（nlmg）や TranshBin の一括処理が後方互換を壊していないか
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
